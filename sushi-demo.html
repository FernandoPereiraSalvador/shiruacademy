<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Japanify · Sushi Quiz</title>
  <style>
    :root {
      --cream: #fff8e8;
      --paper: #fffdf7;
      --ink: #513d46;
      --muted: #9c7c86;
      --pink: #f59bb8;
      --pink-dark: #df6e93;
      --red: #ef7180;
      --green: #83c995;
      --green-dark: #4f9b73;
      --gold: #ffd783;
      --wood-1: #e8b77f;
      --wood-2: #d89b68;
      --wood-3: #bf805b;
      --blue: #bfe8ef;
      --shadow: 0 16px 32px rgba(104, 72, 54, .16);
      --soft-shadow: 0 9px 18px rgba(104, 72, 54, .13);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #f3e1c8;
      font-family: Inter, ui-rounded, "Hiragino Maru Gothic ProN", "Noto Sans JP",
        system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .game-shell {
      position: relative;
      width: min(100vw, 520px);
      height: 100dvh;
      min-height: 640px;
      margin: 0 auto;
      overflow: hidden;
      isolation: isolate;
      background: linear-gradient(180deg, #fff7e8 0%, #fffaf2 36%, #e7b276 36.3%, #cf8c59 100%);
      box-shadow: 0 0 55px rgba(82, 58, 43, .24);
    }

    /* ---------- kitchen background ---------- */
    .wall-glow {
      position: absolute;
      inset: 0 0 auto 0;
      height: 48%;
      z-index: -6;
      background:
        radial-gradient(circle at 83% 10%, rgba(255, 211, 130, .44), transparent 24%),
        radial-gradient(circle at 14% 18%, rgba(247, 171, 195, .18), transparent 22%);
    }

    .tile-line {
      position: absolute;
      z-index: -5;
      left: 0;
      right: 0;
      top: 36%;
      height: 12px;
      background: #bf7d56;
      box-shadow: 0 6px 0 rgba(255,255,255,.34);
    }

    .countertop {
      position: absolute;
      z-index: -5;
      left: 0;
      right: 0;
      bottom: 0;
      height: 64%;
      background:
        repeating-linear-gradient(0deg, transparent 0 92px, rgba(133, 74, 47, .12) 93px 96px),
        repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 52px, rgba(133, 74, 47, .08) 53px 56px),
        linear-gradient(180deg, #edbd7d 0%, #df9d67 48%, #cf8857 100%);
    }

    .countertop::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 18px;
      background: rgba(125, 75, 48, .15);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.24);
    }

    .countertop::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .35;
      background:
        radial-gradient(ellipse at 15% 22%, rgba(255,255,255,.16) 0 7%, transparent 8%),
        radial-gradient(ellipse at 76% 66%, rgba(126,77,47,.10) 0 9%, transparent 10%);
      pointer-events: none;
    }

    .table-front-edge {
      position: absolute;
      z-index: 1;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16px;
      background: rgba(126, 74, 48, .24);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.12);
      pointer-events: none;
    }


    .shelf {
      position: absolute;
      z-index: -3;
      left: 30px;
      right: 30px;
      top: 104px;
      height: 13px;
      border-radius: 8px;
      background: #d79b72;
      box-shadow: 0 7px 0 rgba(155, 97, 71, .13);
    }

    .shelf-item {
      position: absolute;
      z-index: -2;
      bottom: 10px;
    }

    .soy-bottle {
      left: 21px;
      width: 37px;
      height: 73px;
      border-radius: 10px 10px 15px 15px;
      background: #8e5e53;
      box-shadow: inset 0 -14px 0 rgba(79, 46, 44, .16);
    }
    .soy-bottle::before {
      content: "";
      position: absolute;
      left: 10px;
      top: -17px;
      width: 17px;
      height: 22px;
      border-radius: 6px 6px 2px 2px;
      background: #ed7784;
    }
    .soy-bottle::after {
      content: "醤";
      position: absolute;
      left: 8px;
      top: 24px;
      width: 21px;
      height: 25px;
      display: grid;
      place-items: center;
      border-radius: 4px;
      color: #7b514b;
      background: #fff3db;
      font-weight: 900;
      font-size: 13px;
    }

    .tea-cup {
      left: 88px;
      bottom: 9px;
      width: 55px;
      height: 42px;
      border-radius: 5px 5px 18px 18px;
      background: #9fcfb6;
      box-shadow: inset 0 -9px 0 rgba(77, 151, 112, .12);
    }
    .tea-cup::after {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      top: 6px;
      height: 7px;
      border-radius: 50%;
      background: #6f9a78;
      opacity: .55;
    }

    .rice-bowl {
      right: 18px;
      bottom: 8px;
      width: 75px;
      height: 45px;
      border-radius: 5px 5px 32px 32px;
      background: #9acada;
      box-shadow: inset 0 -10px 0 rgba(67, 135, 157, .12);
    }
    .rice-bowl::before {
      content: "";
      position: absolute;
      left: 5px;
      right: 5px;
      top: -14px;
      height: 27px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 25% 50%, #fff 0 13px, transparent 14px),
        radial-gradient(circle at 53% 40%, #fff 0 16px, transparent 17px),
        radial-gradient(circle at 75% 57%, #fff 0 13px, transparent 14px),
        #fff;
      box-shadow: 0 2px 0 rgba(86, 112, 122, .12);
    }

    .nori-stack {
      right: 119px;
      bottom: 9px;
      width: 52px;
      height: 43px;
      transform: rotate(-5deg);
      border-radius: 5px;
      background: #4f7c66;
      box-shadow: 7px 4px 0 #659176, 13px 8px 0 #7da387;
    }

    .hanging-sign {
      position: absolute;
      z-index: -1;
      top: 172px;
      right: 22px;
      width: 70px;
      height: 92px;
      display: grid;
      place-items: center;
      border-radius: 5px;
      color: #d66975;
      background: rgba(255,253,244,.70);
      border: 2px solid rgba(222, 156, 116, .36);
      box-shadow: var(--soft-shadow);
      font-size: 29px;
      font-weight: 900;
      writing-mode: vertical-rl;
      letter-spacing: 4px;
      transform: rotate(1.5deg);
    }

    .hanging-sign::before {
      content: "";
      position: absolute;
      top: -32px;
      left: 50%;
      width: 2px;
      height: 33px;
      background: #c78c6c;
      transform: translateX(-50%);
    }

    .window {
      position: absolute;
      z-index: -6;
      left: 22px;
      top: 151px;
      width: 142px;
      height: 118px;
      overflow: hidden;
      border: 7px solid rgba(204, 142, 105, .64);
      border-radius: 7px;
      background: linear-gradient(180deg, #bceaf0, #e8f4d8 61%, #a7d499 62%);
    }

    .window::before,
    .window::after {
      content: "";
      position: absolute;
      background: rgba(204, 142, 105, .60);
    }
    .window::before { left: 61px; top: 0; bottom: 0; width: 6px; }
    .window::after { left: 0; right: 0; top: 51px; height: 6px; }

    .window-sakura {
      position: absolute;
      left: -12px;
      bottom: 4px;
      width: 108px;
      height: 54px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 17% 48%, #f59fbd 0 12px, transparent 13px),
        radial-gradient(circle at 37% 28%, #ffc0d4 0 14px, transparent 15px),
        radial-gradient(circle at 58% 54%, #f18fb3 0 13px, transparent 14px),
        radial-gradient(circle at 78% 30%, #ffc0d4 0 12px, transparent 13px);
    }

    /* ---------- header ---------- */
    .hud {
      position: absolute;
      z-index: 30;
      inset: 0 0 auto 0;
      padding: max(14px, env(safe-area-inset-top)) 14px 8px;
      pointer-events: none;
    }

    .hud-top {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn,
    .mode-btn,
    .primary-btn {
      border: 0;
      color: var(--ink);
      background: rgba(255,253,247,.90);
      box-shadow: var(--soft-shadow);
      transition: transform .16s ease, background .16s ease;
    }

    .icon-btn:active,
    .mode-btn:active,
    .primary-btn:active {
      transform: scale(.94);
    }

    .icon-btn {
      pointer-events: auto;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 15px;
      font-weight: 950;
      font-size: 20px;
    }

    .title-card {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      height: 49px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.84);
      border-radius: 17px;
      background: rgba(255,253,247,.84);
      box-shadow: var(--soft-shadow);
      backdrop-filter: blur(12px);
    }

    .title-card .emoji {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 12px;
      background: rgba(245,155,184,.20);
      font-size: 18px;
    }

    .title-copy {
      min-width: 0;
      flex: 1;
    }

    .title-copy strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      letter-spacing: .01em;
    }

    .progress-track {
      width: 100%;
      height: 7px;
      margin-top: 5px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(81,61,70,.10);
    }

    .progress-fill {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--pink), #f5bb88);
      transition: width .36s ease;
    }

    .score-pill {
      min-width: 64px;
      height: 44px;
      display: flex;
      flex: 0 0 auto;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 1px;
      white-space: nowrap;
      border-radius: 15px;
      color: var(--pink-dark);
      background: rgba(255,253,247,.91);
      box-shadow: var(--soft-shadow);
      font-weight: 950;
      font-size: 14px;
      line-height: 1;
    }

    .score-pill span {
      display: inline-block;
      white-space: nowrap;
    }

    .mode-row {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 10px;
      pointer-events: auto;
    }

    .mode-btn {
      padding: 7px 11px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .mode-btn.active {
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
    }

    /* ---------- preparation scene ---------- */
    .prep-scene {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 280px;
      bottom: 0;
    }

    .bamboo-mat {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 44px;
      width: 346px;
      height: 258px;
      transform: translateX(-50%);
      border: 7px solid rgba(159, 99, 60, .28);
      border-radius: 22px;
      background:
        repeating-linear-gradient(90deg, #f2d48e 0 11px, #ddb873 11px 14px),
        #e9c97c;
      box-shadow:
        0 20px 30px rgba(103, 65, 44, .20),
        inset 0 0 0 2px rgba(255,255,255,.22);
    }

    .bamboo-mat::before,
    .bamboo-mat::after {
      content: "";
      position: absolute;
      left: 13px;
      right: 13px;
      height: 4px;
      border-radius: 999px;
      background: rgba(154, 91, 56, .31);
    }
    .bamboo-mat::before { top: 27px; }
    .bamboo-mat::after { bottom: 27px; }

    .plate-shadow {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 88px;
      width: 282px;
      height: 190px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(106, 63, 45, .18);
      filter: blur(5px);
    }

    .drop-plate {
      position: absolute;
      z-index: 8;
      left: 50%;
      top: 58px;
      width: 294px;
      height: 216px;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(ellipse at center, #fffefa 0 54%, #f6ecdf 55% 62%, #eb9b9f 63% 66%, #fff6ec 67% 100%);
      box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.84),
        0 18px 28px rgba(101, 68, 52, .18);
      transition: transform .18s ease, filter .18s ease;
    }

    .drop-plate.is-over {
      transform: translateX(-50%) scale(1.045);
      filter: drop-shadow(0 0 14px rgba(239, 113, 128, .34));
    }

    .drop-plate.correct {
      animation: plateSuccess .55s ease;
    }

    .drop-plate.wrong {
      animation: plateWrong .42s ease;
    }

    .plate-inner {
      width: 134px;
      height: 102px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,.62);
      border: 2px dashed rgba(224, 130, 143, .34);
      transition: color .18s ease, border-color .18s ease, background .18s ease;
    }

    .plate-character {
      max-width: 120px;
      padding: 0 5px;
      text-align: center;
      color: var(--ink);
      font-size: clamp(44px, 11vw, 62px);
      font-weight: 860;
      line-height: .97;
      letter-spacing: -.06em;
      white-space: pre-line;
    }

    .plate-instruction {
      display: none;
    }

    .decor {
      position: absolute;
      z-index: 5;
      pointer-events: none;
    }

    .knife {
      left: 8px;
      top: 164px;
      width: 106px;
      height: 19px;
      border-radius: 15px 2px 2px 15px;
      background: linear-gradient(180deg, #f8faf9, #cbd9d8);
      transform: rotate(-14deg);
      box-shadow: 0 7px 10px rgba(100, 69, 54, .12);
    }
    .knife::after {
      content: "";
      position: absolute;
      left: -51px;
      top: -2px;
      width: 58px;
      height: 23px;
      border-radius: 12px 3px 3px 12px;
      background: #ad755b;
    }

    .salmon-slices {
      right: 13px;
      top: 136px;
      width: 93px;
      height: 64px;
      transform: rotate(6deg);
    }

    .salmon-slices span {
      position: absolute;
      width: 71px;
      height: 25px;
      border-radius: 18px 7px 18px 7px;
      background:
        repeating-linear-gradient(160deg, transparent 0 11px, rgba(255,238,216,.72) 12px 15px),
        #f58e7e;
      box-shadow: 0 6px 9px rgba(109, 68, 58, .12);
    }
    .salmon-slices span:nth-child(1) { top: 0; left: 0; }
    .salmon-slices span:nth-child(2) { top: 18px; left: 13px; }
    .salmon-slices span:nth-child(3) { top: 36px; left: 4px; }

    .wasabi {
      right: 35px;
      top: 228px;
      width: 40px;
      height: 27px;
      border-radius: 52% 48% 48% 52%;
      background: #94c77c;
      box-shadow: inset 0 -7px 0 rgba(79, 147, 87, .13);
      transform: rotate(-7deg);
    }

    .ginger {
      left: 28px;
      top: 252px;
      width: 54px;
      height: 31px;
      border-radius: 48% 52% 42% 58%;
      background: #f4b5bb;
      box-shadow:
        15px 3px 0 #f7c5c8,
        6px -9px 0 #ef9faa;
      transform: rotate(-10deg);
    }

    .chopsticks {
      right: 8px;
      top: 254px;
      width: 150px;
      height: 8px;
      border-radius: 999px;
      background: #b87352;
      box-shadow: 0 12px 0 #c8865e;
      transform: rotate(-13deg);
    }

    /* ---------- answer tray ---------- */
    .answer-tray {
      position: absolute;
      z-index: 14;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      width: min(470px, calc(100% - 18px));
      min-height: 148px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: end;
      gap: 6px;
      padding: 12px 10px 10px;
      transform: translateX(-50%);
      border: 5px solid rgba(141, 86, 57, .25);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.11), transparent 22%),
        repeating-linear-gradient(90deg, #e9b877 0 30px, #dda368 30px 33px);
      box-shadow:
        0 16px 22px rgba(94, 57, 40, .18),
        inset 0 0 0 2px rgba(255,255,255,.16);
    }

    .answer-tray::before {
      content: none;
      display: none;
    }

    .sushi-option {
      position: relative;
      height: 116px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 16px;
      color: var(--ink);
      background: transparent;
      touch-action: none;
      cursor: grab;
      transition: transform .17s ease, opacity .17s ease, filter .17s ease;
    }

    .sushi-option:active {
      cursor: grabbing;
    }

    .sushi-option:hover {
      transform: translateY(-8px);
      filter: drop-shadow(0 10px 8px rgba(107, 71, 48, .18));
    }

    .sushi-option.dragging {
      opacity: .24;
      transform: scale(.95);
    }

    .sushi-answer {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: 50%;
      width: 91px;
      overflow: hidden;
      padding: 2px 4px 3px;
      transform: translate(-50%, -56%);
      border-radius: 999px;
      color: #543b40;
      background: rgba(255, 250, 236, .58);
      box-shadow: 0 2px 4px rgba(92, 58, 44, .08);
      font-size: clamp(22px, 6.8vw, 29px);
      font-weight: 1000;
      letter-spacing: -.04em;
      line-height: .95;
      text-align: center;
      text-overflow: ellipsis;
      text-shadow:
        0 1px 0 rgba(255,255,255,.88),
        0 0 4px rgba(255,255,255,.70);
      white-space: nowrap;
      pointer-events: none;
    }

    .sushi-option[data-style="tuna"] .sushi-answer,
    .sushi-option[data-style="salmon"] .sushi-answer,
    .sushi-option[data-style="shrimp"] .sushi-answer {
      color: #5b3740;
      background: rgba(255, 247, 231, .58);
    }

    .sushi-option[data-style="tamago"] .sushi-answer,
    .sushi-option[data-style="avocado"] .sushi-answer {
      color: #514238;
      background: rgba(255, 252, 232, .60);
    }

    .sushi-option[data-style="maki"] .sushi-answer {
      top: 50%;
      width: 64px;
      padding: 2px 3px 3px;
      transform: translate(-50%, -50%);
      color: #fffdf4;
      background: rgba(55, 93, 74, .56);
      font-size: clamp(19px, 5.8vw, 24px);
      text-shadow:
        0 1px 2px rgba(35,70,56,.78),
        0 0 5px rgba(35,70,56,.62);
    }

    /* ---------- CSS sushi pieces ---------- */
    .sushi-piece {
      position: relative;
      width: 88px;
      height: 62px;
      transform-origin: center;
      transform: scale(1.28);
      filter: drop-shadow(0 8px 7px rgba(104, 70, 49, .16));
    }

    .sushi-piece .rice {
      position: absolute;
      left: 13px;
      right: 13px;
      bottom: 4px;
      height: 39px;
      border-radius: 43% 47% 41% 45%;
      background:
        radial-gradient(circle at 10% 25%, rgba(229,219,204,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 28% 60%, rgba(229,219,204,.8) 0 1px, transparent 2px),
        radial-gradient(circle at 54% 32%, rgba(229,219,204,.9) 0 1px, transparent 2px),
        radial-gradient(circle at 79% 59%, rgba(229,219,204,.8) 0 1px, transparent 2px),
        #fffdf8;
      box-shadow: inset 0 -8px 0 rgba(231, 217, 198, .25);
    }

    .sushi-piece .topping {
      position: absolute;
      z-index: 2;
      left: 5px;
      right: 5px;
      top: 5px;
      height: 30px;
      border-radius: 44% 43% 31% 32%;
      transform: rotate(-2deg);
    }

    .sushi-piece.salmon .topping {
      background:
        repeating-linear-gradient(160deg, transparent 0 13px, rgba(255,237,217,.72) 14px 17px),
        #f28d7c;
    }

    .sushi-piece.tuna .topping {
      background:
        repeating-linear-gradient(165deg, transparent 0 16px, rgba(255,184,180,.33) 17px 19px),
        #e16f78;
    }

    .sushi-piece.tamago .topping {
      top: 1px;
      height: 36px;
      background: #f5cd68;
      box-shadow: inset 0 -7px 0 rgba(210, 158, 55, .13);
    }

    .sushi-piece.tamago::after {
      content: "";
      position: absolute;
      z-index: 4;
      left: 39px;
      top: 0;
      width: 12px;
      height: 52px;
      border-radius: 3px;
      background: #4f7b64;
    }

    .sushi-piece.shrimp .topping {
      background:
        repeating-linear-gradient(135deg, transparent 0 15px, rgba(255,252,237,.78) 16px 21px),
        #f19b95;
    }

    .sushi-piece.avocado .topping {
      background:
        repeating-linear-gradient(155deg, transparent 0 14px, rgba(233,248,198,.42) 15px 17px),
        #a6cb77;
    }

    .sushi-piece.maki {
      width: 70px;
      height: 70px;
      transform: scale(1.30);
    }

    .sushi-piece.maki .rice {
      inset: 5px;
      height: auto;
      border-radius: 50%;
      border: 9px solid #527962;
      background: #fffdf8;
    }

      border-radius: 17px;
      color: #fff;
      background: linear-gradient(135deg, var(--pink), var(--pink-dark));
      font-size: 15px;
      font-weight: 950;

      80% { transform: translateX(calc(-50% + 6px)); }

      return translations[state.locale]?.[key] || translations.en[key] || key;

      state.locale = normalizeLocale(locale);
      document.documentElement.lang = state.locale;

      if (window.Japanify && typeof window.Japanify.postMessage === "function") {
        window.Japanify.postMessage(JSON.stringify(payload));

      const copy = [...items];

      for (let index = copy.length - 1; index > 0; index--) {
        const target = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[target]] = [copy[target], copy[index]];
      }

      return copy;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function visibleCharacter(raw) {
      const value = String(raw ?? "").trim();
      if (state.mode !== "kanji") return value;

      return value.split("/")[0].trim();
    }

    function normalizeItem(rawItem, index) {
      const item = rawItem || {};
      const translation = String(item.translation ?? item.answer ?? "").trim();
      const explicitType = String(item.type ?? "").trim();

      return {
        id: String(item.id ?? `${index}-${item.character}-${translation}`),
        character: String(item.character ?? "").trim(),
        translation,
        type: explicitType || (state.mode === "kanji" ? "image" : "text")
      };
    }

    function currentSet() {
      return state.sets[state.mode] || [];
    }

    function currentQuestion() {
      return state.questions[state.currentIndex] || null;
    }

    function answerKey(item) {
      return `${item.type}::${item.translation}`;
    }

    function setPlateCharacter() {
      const question = currentQuestion();
      const character = visibleCharacter(question?.character);
      const length = Array.from(character).length;

      plateCharacter.textContent = character;
      plateCharacter.classList.toggle("kanji", state.mode === "kanji");
      plateCharacter.classList.remove(
        "kanji-length-2",
        "kanji-length-3",
        "kanji-length-4"
      );

      if (state.mode === "kanji") {
        if (length >= 4) {
          plateCharacter.classList.add("kanji-length-4");
        } else if (length === 3) {
          plateCharacter.classList.add("kanji-length-3");
        } else if (length === 2) {
          plateCharacter.classList.add("kanji-length-2");
        }
      }
    }

    function initializeGame() {
      const source = currentSet();

      if (!source.length) {
        showToast(t("noCharacters"));
        return;
      }

      state.questions = shuffle(source).slice(0, 10);
      state.currentIndex = 0;
      state.score = 0;
      state.mistakes = 0;
      state.started = true;
      state.locked = false;
      state.paused = false;

      scoreLabel.textContent = "0";
      totalLabel.textContent = String(state.questions.length);
      progressFill.style.width = "0%";

      introOverlay.classList.add("hidden");
      pauseOverlay.classList.add("hidden");
      finishOverlay.classList.add("hidden");

      renderQuestion();
      answerTray.querySelector("button")?.focus({preventScroll: true});
    }

    function renderQuestion() {
      const restoreFocus = answerTray.contains(document.activeElement);
      clearLandedSushi();

      if (state.currentIndex >= state.questions.length) {
        finishGame();
        return;
      }

      const question = currentQuestion();
      setPlateCharacter();

      const source = currentSet();
      const usedAnswers = new Set([answerKey(question)]);

      const distractors = [];

      for (const item of shuffle(source)) {
        const key = answerKey(item);

        if (usedAnswers.has(key)) continue;

        usedAnswers.add(key);
        distractors.push(item);

        if (distractors.length >= 2) break;
      }

      state.renderedOptions = shuffle([question, ...distractors]);

      answerTray.innerHTML = "";

      state.renderedOptions.forEach((option, index) => {
        const style = sushiStyles[(state.currentIndex + index) % sushiStyles.length];
        const button = document.createElement("button");

        button.type = "button";
        button.className = `sushi-option ${option.type === "image" ? "has-image" : ""}`;
        button.dataset.optionIndex = String(index);
        button.dataset.style = style;
        button.setAttribute("aria-label", option.translation);

        button.innerHTML = sushiMarkup(style, option, true);

        const image = button.querySelector("img");

        if (image) {
          image.addEventListener("error", () => {
            console.warn("No se pudo cargar la imagen del kanji:", option.translation);
            button.classList.add("image-error");
          }, { once: true });
        }

        button.addEventListener("pointerdown", event => beginDrag(event, button));
        button.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            submitAnswer(option, style);
          }
        });
        answerTray.appendChild(button);
      });
      if (restoreFocus) answerTray.querySelector("button")?.focus({preventScroll: true});
    }

    function sushiMarkup(style, option = null, includeAnswer = false) {
      let answerMarkup = "";

      if (includeAnswer && option) {
        if (option.type === "image") {
          answerMarkup = `
            <img class="sushi-answer-image" src="${escapeHtml(option.translation)}" alt="" />
            <span class="image-fallback">?</span>
          `;
        } else {
          answerMarkup = `<span class="sushi-answer">${escapeHtml(option.translation)}</span>`;
        }
      }

      return `
        <div class="sushi-piece ${style}">
          <div class="rice"></div>
          <div class="topping"></div>
        </div>
        ${answerMarkup}
      `;
    }

    function beginDrag(event, optionElement) {
      if (!state.started || state.locked || state.paused || state.dragging) return;

      event.preventDefault();

      state.dragging = optionElement;
      state.pointerId = event.pointerId;
      state.pointerStart = {x: event.clientX, y: event.clientY};

      optionElement.classList.add("dragging");
      optionElement.setPointerCapture?.(event.pointerId);

      const option = state.renderedOptions[Number(optionElement.dataset.optionIndex)];
      const ghost = document.createElement("div");

      ghost.className = "drag-ghost";
      ghost.id = "dragGhost";
      ghost.innerHTML = sushiMarkup(optionElement.dataset.style, option, true);

      document.body.appendChild(ghost);

      moveGhost(event.clientX, event.clientY);

      document.addEventListener("pointermove", handlePointerMove, { passive: false });
      document.addEventListener("pointerup", endDrag, { passive: false });
      document.addEventListener("pointercancel", cancelDrag, { passive: false });
    }

    function handlePointerMove(event) {
      if (!state.dragging || event.pointerId !== state.pointerId) return;

      event.preventDefault();

      moveGhost(event.clientX, event.clientY);
      dropPlate.classList.toggle("is-over", pointInsidePlate(event.clientX, event.clientY));
    }

    function endDrag(event) {
      if (!state.dragging || event.pointerId !== state.pointerId) return;

      event.preventDefault();

      const accepted = pointInsidePlate(event.clientX, event.clientY) || Math.hypot(event.clientX - state.pointerStart.x, event.clientY - state.pointerStart.y) < 10;
      const optionIndex = Number(state.dragging.dataset.optionIndex);
      const style = state.dragging.dataset.style;
      const option = state.renderedOptions[optionIndex];

      cleanupDrag();

      if (accepted && option) {
        submitAnswer(option, style);
      }
    }

    function cancelDrag(event) {
      if (!state.dragging || event.pointerId !== state.pointerId) return;
      cleanupDrag();
    }

    function cleanupDrag() {
      state.dragging?.classList.remove("dragging");
      document.getElementById("dragGhost")?.remove();
      dropPlate.classList.remove("is-over");

      document.removeEventListener("pointermove", handlePointerMove);
      document.removeEventListener("pointerup", endDrag);
      document.removeEventListener("pointercancel", cancelDrag);

      state.dragging = null;
      state.pointerId = null;
    }

    function moveGhost(x, y) {
      const ghost = document.getElementById("dragGhost");

      if (!ghost) return;

      ghost.style.left = `${x}px`;
      ghost.style.top = `${y}px`;
    }

    function pointInsidePlate(x, y) {
      const rect = dropPlate.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const radiusX = rect.width * .46;
      const radiusY = rect.height * .43;
      const dx = (x - centerX) / radiusX;
      const dy = (y - centerY) / radiusY;

      return dx * dx + dy * dy <= 1;
    }

    function submitAnswer(option, style) {
      if (state.locked || state.paused) return;

      state.locked = true;

      const question = currentQuestion();
      const correct = answerKey(option) === answerKey(question);

      /*
       * Avisamos primero del sonido para que se reproduzca sin esperar
       * al registro del progreso en Flutter.
       */
      notifyFlutter({
        type: "sound",
        correct
      });

      notifyFlutter({
        type: "answer",
        character: question.character,
        correct
      });

      if (correct) {
        state.score += 1;

        scoreLabel.textContent = String(state.score);
        progressFill.style.width = `${Math.round((state.score / state.questions.length) * 100)}%`;

        dropPlate.classList.remove("wrong");
        void dropPlate.offsetWidth;
        dropPlate.classList.add("correct");

        landSushi(style);
        createSparkles();
        showToast(t("perfect"));

        setTimeout(() => {
          state.currentIndex += 1;
          state.locked = false;
          dropPlate.classList.remove("correct");
          renderQuestion();
        }, 820);

        return;
      }

      state.mistakes += 1;

      dropPlate.classList.remove("correct");
      void dropPlate.offsetWidth;
      dropPlate.classList.add("wrong");

      showToast(t("wrong"));


      setTimeout(() => {
        state.locked = false;
        dropPlate.classList.remove("wrong");
      }, 560);
    }

    function landSushi(style) {
      clearLandedSushi();

      const landed = document.createElement("div");

      landed.className = "landed-sushi";
      landed.id = "landedSushi";
      landed.innerHTML = sushiMarkup(style);

      dropPlate.appendChild(landed);
    }

    function clearLandedSushi() {
      document.getElementById("landedSushi")?.remove();
    }

    function createSparkles() {
      const plateRect = dropPlate.getBoundingClientRect();
      const shellRect = gameShell.getBoundingClientRect();

      for (let index = 0; index < 9; index++) {
        const spark = document.createElement("span");

        spark.className = "spark";
        spark.style.left = `${plateRect.left - shellRect.left + plateRect.width / 2 + (Math.random() * 54 - 27)}px`;
        spark.style.top = `${plateRect.top - shellRect.top + plateRect.height / 2 + (Math.random() * 36 - 18)}px`;
        spark.style.setProperty("--dx", `${Math.random() * 80 - 40}px`);
        spark.style.setProperty("--dy", `${Math.random() * -72 - 20}px`);

        gameShell.appendChild(spark);
        setTimeout(() => spark.remove(), 800);
      }
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove("show");
      void toast.offsetWidth;
      toast.classList.add("show");
    }

    function pause(showOverlay = true) {
      if (!finishOverlay.classList.contains("hidden")) return;

      cleanupDrag();

      if (state.started) {
        state.paused = true;
        state.locked = true;
      }

      if (showOverlay) {
        pauseOverlay.classList.remove("hidden");
      }
    }

    function resume() {
      if (!finishOverlay.classList.contains("hidden")) return;

      pauseOverlay.classList.add("hidden");

      if (!state.started) return;

      state.paused = false;
      state.locked = false;
    }

    function finishGame() {
      state.started = false;
      state.locked = true;
      state.paused = false;

      cleanupDrag();

      finishScore.textContent = String(state.score);
      finishMistakes.textContent = String(state.mistakes);

      finishOverlay.classList.remove("hidden");
      document.getElementById("restartBtn").focus({preventScroll: true});

      notifyFlutter({
        type: "finished",
        score: state.score,
        mistakes: state.mistakes
      });
    }

    document.getElementById("startBtn").addEventListener("click", initializeGame);
    document.getElementById("restartBtn").addEventListener("click", initializeGame);
    document.getElementById("resumeBtn").addEventListener("click", resume);
    document.getElementById("backBtn").addEventListener("click", () => pause(true));

    modeRow.addEventListener("click", event => {
      const button = event.target.closest(".mode-btn");

      if (!button || state.customConfig) return;

      state.mode = button.dataset.mode;

      document.querySelectorAll(".mode-btn").forEach(item => {
        item.classList.toggle("active", item.dataset.mode === state.mode);
      });
    });

    window.addEventListener("blur", cleanupDrag);

    window.JapanifyQuiz = {
      setLocale: applyLocale,
      configure(config = {}) {
        const mode = ["hiragana", "katakana", "kanji"].includes(config.mode)
          ? config.mode
          : "hiragana";

        state.mode = mode;
        state.sets[mode] = (Array.isArray(config.characters) ? config.characters : [])
          .map(normalizeItem)
          .filter(item => item.character && item.translation);

        state.customConfig = true;
        state.started = false;
        state.locked = false;
        state.paused = false;

        applyLocale(config.locale);

        modeRow.style.display = "none";
        introOverlay.classList.remove("hidden");
        pauseOverlay.classList.add("hidden");
        finishOverlay.classList.add("hidden");

        const preview = state.sets[mode][0];

        state.questions = preview ? [preview] : [];
        state.currentIndex = 0;

        setPlateCharacter();

        notifyFlutter({
          type: "configured",
          mode,
          characters: state.sets[mode].length
        });

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            notifyFlutter({
              type: "rendered",
              mode
            });
          });
        });
      },

      pause() {
        pause(false);
      },

      openExitMenu() {
        pause(true);
      },

      resume() {
        resume();
      }
    };

    window.JapanifyQuiz.configure({mode: "hiragana", locale: "es", characters: [
      {character:"あ",translation:"a"},{character:"い",translation:"i"},
      {character:"う",translation:"u"},{character:"え",translation:"e"},
      {character:"お",translation:"o"}
    ]});
    totalLabel.textContent = "5";
    notifyFlutter({ type: "ready" });
  })();
</script>
</body>
</html>
